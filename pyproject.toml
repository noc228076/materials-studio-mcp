[project]
name = "material-studio-mcp-server"
version = "0.1.0"
description = "A local MCP server for automating BIOVIA Materials Studio through MaterialsScript."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12.4",
    "pydantic>=2.7",
]

[project.scripts]
material-studio-mcp-server = "material_studio_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_studio_mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
